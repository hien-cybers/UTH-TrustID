name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên web GitHub

jobs:
  build:
    name: Build iOS on macOS Runner
    runs-on: macos-15 # Máy chủ ảo macOS M2/M3 mới nhất của GitHub (Xcode 16+ tương thích Capacitor SPM)

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Thiết lập Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Cài đặt dependencies
        run: npm ci || npm install

      - name: 4. Build giao diện web
        run: npm run build

      - name: 5. Đồng bộ vào Capacitor iOS
        run: npx cap sync ios

      - name: 6. Build App bằng Xcode (Không cần chứng chỉ trả phí)
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            xcodebuild clean build \
              -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath derived_data \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          else
            xcodebuild clean build \
              -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath derived_data \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          fi

      - name: 7. Đóng gói thành file Payload/IPA
        run: |
          cd ios/App/derived_data/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r UTH-TrustID.ipa Payload

      - name: 8. Tải file IPA lên Artifacts để bạn tải về
        uses: actions/upload-artifact@v4
        with:
          name: UTH-TrustID-iOS
          path: ios/App/derived_data/Build/Products/Release-iphoneos/UTH-TrustID.ipa
