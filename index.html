<!doctype html>
<html lang="vi" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>UTH-TrustID</title>

    <!-- Khai báo Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Cấu hình chuẩn cho iOS Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UTH TrustID" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />

    <!-- Màu thanh trạng thái cho Android -->
    <meta name="theme-color" content="#070b14" />
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) {
            regs[i].unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var j = 0; j < keys.length; j++) {
            caches.delete(keys[j]);
          }
        });
      }
    </script>
  </head>
  <body class="bg-[#040914] text-slate-100 m-0 p-0">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
